name: pitty_pat
description: "Pitty Pat: the classic match-the-rank card game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/google_fonts/

# Art is rendered by tool/render_art.dart from the real card widgets.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF8F0"
  image: assets/splash/splash.png
  android_12:
    color: "#FFF8F0"
    image: assets/splash/splash_android12.png
