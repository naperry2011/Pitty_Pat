name: pitty_pat
description: "Pitty Pat: the classic match-the-rank card game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/google_fonts/
  # Real weighted families: each fontWeight picks its own file.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/google_fonts/Fredoka-Regular.ttf
        - asset: assets/google_fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800

# Art is rendered by tool/render_art.dart from the real card widgets.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF8F0"
  image: assets/splash/splash.png
  android_12:
    color: "#FFF8F0"
    image: assets/splash/splash_android12.png
